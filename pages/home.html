<section id="home" class="py-20">
    <div class="container mx-auto px-4">

        <div class="text-center max-w-3xl mx-auto">
            <h1 class="text-5xl font-bold mb-4">
                $title
            </h1>

            <p class="text-slate-600 text-lg">
                $description
            </p>

            <div class="mt-8 flex justify-center gap-4">
                <button
                    class="px-6 py-3 bg-black text-white rounded-lg hover:opacity-90 transition">
                    Explore
                </button>

                <button
                    class="px-6 py-3 border border-slate-300 rounded-lg hover:bg-slate-100 transition">
                    Learn More
                </button>
            </div>
        </div>

    </div>
</section>

<section class="container py-12">

    <h2 class="text-center text-3xl font-bold text-primary mb-8">
        Latest Products
    </h2>

    <div
        id="products"
        class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-2 mt-6 place-items-center sm:max-w-6xl mx-auto">

        <template id="card">
            <article class="w-full sm:max-w-xs bg-[#f3f4f6] rounded-3xl shadow-lg overflow-hidden flex flex-col hover:shadow-xl hover:shadow-primary/40 transition-all duration-300 cursor-pointer relative pb-4">    
                <div class="w-full h-48 overflow-hidden flex items-center justify-center bg-product bg-cover bg-center p-3 rounded-b-3xl">
                    <img 
                        src="$image" 
                        alt="$title" 
                        class="w-auto h-full object-contain rounded-2xl">
                </div>
                
                <div class="p-5 flex-1 flex flex-col">
                    <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase mb-1">
                        $category • $merk
                    </span>

                    <h3 class="text-xl font-bold text-slate-800 mb-2">
                        $title
                    </h3>

                    <p class="text-xs text-slate-500 leading-relaxed mb-6">
                        $description
                    </p>

                    <div class="mt-auto flex items-center justify-between">
                        <div class="flex flex-col">
                            <span class="text-xs font-medium text-slate-400">Total Price</span>
                            <span class="text-lg font-bold text-slate-900">$price</span>
                        </div>

                        <div class="flex items-center gap-2">
                            <button @click="showLoginModal = true" title="Add to Wishlist" aria-label="Add to Wishlist" class="w-10 h-10 rounded-full bg-white text-slate-600 flex items-center justify-center shadow-sm hover:text-red-500 hover:bg-red-50 transition duration-200">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                                </svg>
                            </button>

                            <button title="Add to Cart" aria-label="Add to Cart" class="w-12 h-12 rounded-full bg-primary hover:bg-primary/80 text-white flex items-center justify-center shadow-lg transition duration-200">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                </div>
            </article>

        </template>

    </div>
    <div class="w-full flex justify-center mt-8">
        <button
            onclick="loadPage('product')"
            class="text-base font-semibold text-white bg-primary hover:bg-primary/90 px-6 py-3 rounded-full shadow-md hover:shadow-lg hover:shadow-primary/30 transition-all duration-300">
            See All Product
        </button>
    </div>
</section>
