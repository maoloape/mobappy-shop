<section class="container mx-auto px-4 pt-4 md:pt-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        
        <div class="lg:col-span-2 relative overflow-hidden rounded-2xl md:rounded-3xl shadow-md h-[25vh] md:h-[60vh] w-auto group">
            <div id="home-banners" class="flex h-full w-full transition-transform duration-500 ease-out">
                </div>

            <button id="prev-banner" aria-label="Previous Slide" class="absolute left-4 top-1/2 -translate-y-1/2 z-10 hidden md:flex w-10 h-10 rounded-full bg-white/70 backdrop-blur-xs text-slate-800 items-center justify-center shadow-md opacity-0 group-hover:opacity-100 transition-all duration-300 hover:bg-primary hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
            </button>

            <button id="next-banner" aria-label="Next Slide" class="absolute right-4 top-1/2 -translate-y-1/2 z-10 hidden md:flex w-10 h-10 rounded-full bg-white/70 backdrop-blur-xs text-slate-800 items-center justify-center shadow-md opacity-0 group-hover:opacity-100 transition-all duration-300 hover:bg-primary hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
            </button>

            <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 z-10 bg-black/20 px-2 py-1 rounded-full backdrop-blur-xs">
                <span class="w-2 h-2 rounded-full bg-white opacity-100 transition-all cursor-pointer"></span>
                <span class="w-2 h-2 rounded-full bg-white/50 transition-all cursor-pointer"></span>
                <span class="w-2 h-2 rounded-full bg-white/50 transition-all cursor-pointer"></span>
            </div>
        </div>

        <div id="home-events" class="flex flex-row lg:flex-col gap-3 overflow-x-auto lg:overflow-y-auto lg:overflow-x-hidden scrollbar-none snap-x lg:snap-y snap-mandatory pb-2 lg:pb-0 w-full lg:h-[60vh] content-start">
            </div>

    </div>
</section>

<template id="banner-card">
    <div class="w-full h-full flex-shrink-0">
        <img src="$image" alt="Promo Banner" class="w-full h-full object-cover">
    </div>
</template>

<template id="event-card">
    <div class="h-20 sm:h-24 md:h-[90px] lg:h-auto w-auto lg:w-full aspect-[21/9] flex-shrink-0 overflow-hidden rounded-xl md:rounded-2xl shadow-xs border border-slate-100 hover:scale-[1.02] active:scale-98 transition duration-200 cursor-pointer snap-center">
        <img src="$image" alt="Event Promo" class="w-full h-full object-cover">
    </div>
</template>

<section class="py-12">
    <div class="container mx-auto px-4">

        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-2xl font-bold text-primary">
                    Categories
                </h2>

                <p class="text-sm text-slate-500">
                    Browse by product type
                </p>
            </div>

            <button
                onclick="loadPage('product')"
                class="text-sm font-semibold text-white bg-primary hover:bg-primary/90 px-4 py-2 rounded-full shadow-md hover:shadow-lg hover:shadow-primary/30 transition-all duration-300">
                View All 
            </button>
        </div>

        <div
            id="categories"
            class="flex gap-4 overflow-x-auto pb-4 scroll-smooth no-scrollbar">
            <template id="category-card">
                <article
                    onclick="loadPage('product')" style="background: $hex" class="min-w-[260px] md:min-w-[320px] h-[140px] md:h-[180px] rounded-2xl relative overflow-hidden flex items-center p-5 text-white shadow-lg group transition hover:scale-[0.95] cursor-pointer">
                    <img
                        src="$image"
                        alt="$name"
                        class="absolute right-0 bottom-0 max-h-full h-auto object-contain opacity-90 group-hover:scale-105 transition">

                    <div class="relative z-10 max-w-[50%]">
                        <h3 class="text-lg font-bold">
                            $name
                        </h3>

                        <p class="text-xs opacity-90 mt-1">
                            $description
                        </p>
                    </div>
                </article>
            </template>
        </div>
    </div>
</section>

<section class="py-12">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-2xl font-bold text-primary">
                    Latest Products
                </h2>
                <p class="text-sm text-slate-500">
                    Updated Produtcs
                </p>

            </div>

            <button
                onclick="loadPage('product')"
                class="text-sm font-semibold text-white bg-primary hover:bg-primary/90 px-4 py-2 rounded-full shadow-md hover:shadow-lg hover:shadow-primary/30 transition-all duration-300">
                View All 
            </button>
        </div>

        <div id="products" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 2xl:grid-cols-6 gap-2 mt-6 items-stretch">

            <template id="card">
                <article class="w-full h-full bg-[#f3f4f6] rounded-2xl md:rounded-3xl shadow-md md:shadow-lg overflow-hidden flex flex-col hover:shadow-xl hover:shadow-primary/40 transition-all duration-300 cursor-pointer relative pb-3 md:pb-4">    
                    <div class="w-full h-36 md:h-48 overflow-hidden flex items-center justify-center bg-product bg-cover bg-center p-2 md:p-3 rounded-b-2xl md:rounded-b-3xl">
                        <img 
                            src="$image" 
                            alt="$title" 
                            class="w-auto h-full object-contain rounded-xl md:rounded-2xl">
                    </div>
                    
                    <div class="p-3 md:p-5 flex-1 flex flex-col">
                        <span class="text-[10px] md:text-xs font-semibold text-slate-400 tracking-wider uppercase mb-1">
                            $category • $merk
                        </span>

                        <h3 class="text-base md:text-xl font-bold text-slate-800 line-clamp-2 mb-1 md:mb-2">
                            $title
                        </h3>

                        <p class="text-[11px] md:text-xs text-slate-500 leading-relaxed line-clamp-2 md:line-clamp-none mb-4 md:mb-6">
                            $description
                        </p>

                        <div class="mt-auto flex flex-col md:flex-row md:items-center md:justify-between gap-3 md:gap-0">
                            <div class="flex flex-col w-full">
                                <span class="text-[10px] md:text-xs font-medium text-slate-400">Total Price</span>
                                <span class="text-base md:text-lg font-bold text-primary text-right">¥$price</span>
                            </div>

                            <div class="flex items-center justify-end gap-2 border-t border-slate-200/60 pt-2 md:pt-0 pl-0 md:pl-8 md:border-none">
                                
                                <button @click="showLoginModal = true" title="Add to Wishlist" aria-label="Add to Wishlist" class="w-10 h-10 rounded-full bg-white text-slate-600 flex items-center justify-center shadow-sm hover:text-red-500 hover:bg-red-50 transition duration-200 flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                                    </svg>
                                </button>

                                <button title="Add to Cart" aria-label="Add to Cart" class="w-12 h-12 rounded-full bg-primary hover:bg-primary/80 text-white flex items-center justify-center shadow-md transition duration-200 flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            </template>
        </div>
    </div>
    
</section>
